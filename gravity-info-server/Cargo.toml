[package]
name = "gravity-info-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ethereum_gravity = {git = "https://github.com/gravity-bridge/gravity-bridge", rev="26db7ae135a20d577f82861fac1afd9bc9a1d013"}
cosmos_gravity = {git = "https://github.com/gravity-bridge/gravity-bridge", rev="26db7ae135a20d577f82861fac1afd9bc9a1d013"}
gravity_utils = {git = "https://github.com/gravity-bridge/gravity-bridge", rev="26db7ae135a20d577f82861fac1afd9bc9a1d013"}
relayer = {git = "https://github.com/gravity-bridge/gravity-bridge", rev="26db7ae135a20d577f82861fac1afd9bc9a1d013"}
jsonrpc_server = {git = "https://github.com/gravity-bridge/gravity-bridge", rev="26db7ae135a20d577f82861fac1afd9bc9a1d013"}
gravity_proto = "0.9.2"
deep_space = "2.2"
web30 = "1.12"
clarity = "1.5"
serde_derive = "1"
serde = { version = "1.0", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
actix-web = {version = "4.9", features = ["rustls-0_23"]}
actix-cors = "0.7"
rustls = "0.23"
rustls-pemfile = "0.3"
lazy_static = "1.5"
tonic = "0.12"
futures = "0.3"
num256 = "0.6"
tokio = {version="1", features=["rt-multi-thread"]}
cosmos-sdk-proto-althea = "0.20"
sha256 = "1"
prost-types ="0.13"
rocksdb = "0.23"
actix-rt = "2.10.0"
serde_json = "1.0"
json = "0.12"
hex = "0.4"
chrono = "0.4"
rust_decimal= "1.36"
# we don't call or us OpenSSL directly in this codebase, but by adding
# this dependency with this feature we can enforce that openssl is compiled
# in 'vendored' mode all the way down the tree. What this means is that we use
# an openssl implementation from the crate and not from the system, simplifying
# our build process for a lot of cross-compile situations
openssl = { version = "0.10", features = ["vendored"] }
openssl-probe = "0.1"

[features]
development = []
